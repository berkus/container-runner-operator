type: charm
name: ratings
summary: Kubernetes sidecar operator for the App Center Ratings service
description: |
  Runs the Ratings gRPC backend using Pebble, a relation-provisioned PostgreSQL
  database, and an application-owned Juju JWT secret. Optionally publishes native
  gRPC ingress routes to an existing Traefik over traefik_route. Supports local
  development and Prodstacks 7 (PS7) Juju deployments on Kubernetes.
base: ubuntu@24.04
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
assumes:
  - k8s-api
  - juju >= 3.6.4
containers:
  ratings:
    resource: ratings-image
resources:
  ratings-image:
    type: oci-image
    description: Ratings rock containing /bin/ratings and the ratings Pebble service
requires:
  database:
    interface: postgresql_client
    limit: 1
  logging:
    interface: loki_push_api
    optional: true
  traefik-route:
    interface: traefik_route
    limit: 1
    optional: true
peers:
  ratings-peers:
    interface: ratings_peers
config:
  options:
    database-name:
      type: string
      default: ratings
      description: |
        PostgreSQL SQL database name requested from the provider (not a DBaaS
        service name or Juju offer URL). Set before relating the database.
        Use 1-63 ASCII letters, digits, underscores or hyphens, not a leading
        hyphen. Changing it on an existing relation blocks the workload.
    external-hostname:
      type: string
      default: ""
      description: |
        DNS hostname for optional Traefik gRPC ingress, e.g. ratings.localhost or
        ratings.staging.ubuntu.com. Required only when traefik-route is related.
        ASCII DNS labels of 1-63 characters, at most 253 total; no URLs, ports,
        paths, wildcards or trailing dot. Normalised to lowercase in Host rules.
        The deployment supplies ingress, DNS and certificates; the final hop to
        Ratings uses plaintext HTTP/2 (h2c).
    snap-store-url:
      type: string
      default: https://api.snapcraft.io/v2/
      description: Absolute HTTP(S) Snap Store API base URL, including trailing slash.
    rust-log:
      type: string
      default: info,sqlx=warn,hyper=warn,reqwest=warn
      description: Rust tracing EnvFilter; verbose filters may log sensitive workload data.
actions:
  rotate-jwt-secret:
    description: |
      Rotate the application JWT signing secret on the leader. Restarts all units
      as peer changes propagate; existing JWTs become invalid. No secret is returned.
parts:
  charm:
    plugin: charm
    source: .
    charm-entrypoint: src/charm.py
    charm-requirements: [requirements.txt]
    charm-strict-dependencies: true
    charm-binary-python-packages: [pydantic-core]
